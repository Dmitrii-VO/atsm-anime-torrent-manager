<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Проверка безопасности</title>

<style>
* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
}

body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #f5f5f5;
    color: #171717;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 20px;
}

.card {
    width: 730px;
    max-width: 100%;

    background: #fff;
    border: 1px solid #ddd;
    border-radius: 14px;

    padding: 32px 40px 30px;

    box-shadow: 0 10px 32px rgba(0, 0, 0, .06);

    text-align: center;
}

.spinner {
    width: 52px;
    height: 52px;

    margin: 0 auto 22px;

    border: 5px solid #dedede;
    border-top-color: #222;
    border-radius: 50%;

    animation: spin .8s linear infinite;
}

h1 {
    margin: 0 0 16px;

    font-size: 28px;
    line-height: 1.25;
    font-weight: 700;
}

.description {
    margin: 0 0 12px;

    color: #555;

    font-size: 18px;
    line-height: 1.5;
}

#status {
    margin: 0;

    color: #444;

    font-size: 18px;
    line-height: 1.5;
}

small {
    display: block;

    margin-top: 14px;

    color: #999;

    font-size: 15px;
}

@keyframes spin {
    to {
        transform: rotate(360deg);
    }
}

/* Телефоны */
@media (max-width: 700px) {

    body {
        padding: 14px;
    }

    .card {
        padding: 30px 20px 28px;
    }

    .spinner {
        width: 46px;
        height: 46px;

        border-width: 4px;

        margin-bottom: 20px;
    }

    h1 {
        font-size: 23px;
        margin-bottom: 14px;
    }

    .description,
    #status {
        font-size: 16px;
    }

    small {
        font-size: 14px;
    }
}
</style>
</head>

<body>

<div class="card">

    <div class="spinner"></div>

    <h1>Проверяем ваш браузер</h1>

    <p class="description">
        Это автоматическая защита сайта от повышенной нагрузки и ботов.
    </p>

    <p id="status">
        Проверка выполняется…
    </p>

    <small>
        Страница обновится автоматически.
    </small>

    <noscript>
        <p>
            <b>Для продолжения включите JavaScript.</b>
        </p>
    </noscript>

</div>

<script>
(function () {

    try {

        var secure =
            location.protocol === "https:"
                ? "; Secure"
                : "";

        document.cookie =
            "l7_browser=U4D8camo_0ocmwHApNU5Sw_1v1BHql1ZmvzLN_doRfQ;" +
            " Max-Age=3600;" +
            " Path=/;" +
            " SameSite=Lax" +
            secure;

        setTimeout(function () {

            document.getElementById("status").textContent =
                "Проверка пройдена. Перенаправляем…";

            setTimeout(function () {
                location.reload();
            }, 500);

        }, 700);

    } catch (e) {

        document.getElementById("status").textContent =
            "Не удалось выполнить проверку.";

    }

})();
</script>

</body>
</html>
